<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  fill="none"
>
  <!-- Background -->
  <rect
    x="2"
    y="2"
    width="96"
    height="96"
    rx="24"
    fill="#0F294A"
  />

  <!-- Subtle border -->
  <rect
    x="2.5"
    y="2.5"
    width="95"
    height="95"
    rx="23.5"
    stroke="#1E4F82"
    stroke-width="1"
  />

  <!-- TOVIX Symbol -->
  <path
    d="M25 27
       H75
       C77.2 27 78.4 29.5 77 31.2
       L70.5 39
       C69.8 39.9 68.7 40.5 67.5 40.5
       H57
       V66
       C57 67.4 56.4 68.7 55.3 69.5
       L47 75.5
       C44.8 77.1 42 75.5 42 72.8
       V40.5
       H32.5
       C31.3 40.5 30.2 39.9 29.5 39
       L23 31.2
       C21.6 29.5 22.8 27 25 27Z"
    fill="url(#tovixGradient)"
  />

  <!-- T Highlight -->
  <path
    d="M25 27H75C77.2 27 78.4 29.5 77 31.2L70.5 39H57V48L42 59V40.5H32.5C31.3 40.5 30.2 39.9 29.5 39L23 31.2C21.6 29.5 22.8 27 25 27Z"
    fill="url(#highlightGradient)"
    opacity="0.9"
  />

  <!-- Tool Nodes -->
  <circle
    cx="28"
    cy="82"
    r="2.5"
    fill="#3B82F6"
  />

  <circle
    cx="50"
    cy="82"
    r="2.5"
    fill="#38BDF8"
  />

  <circle
    cx="72"
    cy="82"
    r="2.5"
    fill="#60A5FA"
  />

  <!-- Tool connection -->
  <path
    d="M28 82H72"
    stroke="#2563EB"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Gradients -->
  <defs>
    <linearGradient
      id="tovixGradient"
      x1="22"
      y1="25"
      x2="78"
      y2="76"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient
      id="highlightGradient"
      x1="25"
      y1="27"
      x2="58"
      y2="58"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

</svg>
